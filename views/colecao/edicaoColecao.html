<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Coleção</title>
    <link rel="stylesheet" href="/css/form.css">
</head>
    <script src="/js/nav.js"></script>
<body>
    <!-- Navigation Header -->
    <header class="site-header">
        <div class="header-container">
            <!-- Brand/Logo Area -->
            <a href="/" class="nav-brand">
                Simone Paduanello <span>Home Decor</span>
            </a>

            <!-- Desktop Menu -->
            <nav class="nav-menu" id="nav-menu">
                <a href="/produto" class="nav-link">Produtos</a>
                <a href="/material" class="nav-link">Materiais</a>
                <a href="/cor" class="nav-link">Cores</a>
                <a href="/categoria" class="nav-link">Categorias</a>
                <a href="/colecao" class="nav-link">Coleções</a>
                <a href="/localArmazenamento" class="nav-link">Locais</a>
            </nav>

            <!-- Hamburger Button for Mobile -->
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>
    
    <form id="edicaoForm" class="form" method="post">
        <div class="container-form">
            <div class="content">

                <h1>Edição de Coleção</h1>

                <div class="input-group">
                    <label for="nomeInput" class="label">Nome da Coleção</label>
                    <input id="nomeInput" class="input" type="text" placeholder="Ex: Vermelho" required>
                </div>

                <div class="input-group">
                    <label for="descricaoInput" class="label">Descrição</label>
                    <input id="descricaoInput" class="input" type="text">
                </div>

                <div class="button-container">
                    <button type="submit" class="submit-button" id="edicao-button">Cadastrar</button>
                </div>
            </div>
        </div>
    </form>

    <script src="/js/colecao/edicaoColecao.js"></script>
</body>
</html>
