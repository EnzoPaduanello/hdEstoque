<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Cores</title>
    <link rel="stylesheet" href="/css/form.css">
</head>
    <script src="/js/nav.js"></script>
<body>
    <!-- Navigation Header -->
    <header class="site-header">
        <div class="header-container">
            <!-- Brand/Logo Area -->
            <a href="/" class="nav-brand">
                Simone Paduanello <span>Home Decor</span>
            </a>

            <!-- Desktop Menu -->
            <nav class="nav-menu" id="nav-menu">
                <a href="/produto" class="nav-link">Produtos</a>
                <a href="/material" class="nav-link">Materiais</a>
                <a href="/cor" class="nav-link">Cores</a>
                <a href="/categoria" class="nav-link">Categorias</a>
                <a href="/colecao" class="nav-link">Coleções</a>
                <a href="/localArmazenamento" class="nav-link">Locais</a>
            </nav>

            <!-- Hamburger Button for Mobile -->
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <div id="pageDiv">
        <div class="container-form">
            
            <div class="title-div">
                <h2 class="system-title">Gerenciamento de Cores</h2>
            </div>

            <div class="pesquisa-form-div">
                <label class="label" style="width: 100%;" for="pesquisa-input">Digite o nome da cor para a pesquisa:</label>
                
                <input type="text" class="input" id="pesquisa-input">
                
                <div class="button-container" style="width: 100%; margin-top: 10px;">
                    <button type="button" class="submit-button" style="width: auto; padding: 0 20px;" id="pesquisa-button">Pesquisar</button>
                    <button type="button" class="submit-button" style="width: auto; padding: 0 20px;" id="cadastrar-button">Cadastrar Cor</button>
                </div>
            </div>

            <div id="descricaoPaginaDiv">
                Para editar ou excluir alguma cor, clique na cor desejada localizada na lista.
            </div>

            <div class="list-div" id="list-div">
                
            </div>

        </div>
    </div>

    <script src="/js/cor/gerenciamentoCor.js"></script>
</body>
</html>
